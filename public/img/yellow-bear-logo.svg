<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Plushie Packs Yellow Bear Emblem</title>
  <desc id="desc">Stylized yellow plushie mascot with black-and-gold emblem face.</desc>
  <defs>
    <radialGradient id="gold" cx="38%" cy="24%" r="72%">
      <stop offset="0%" stop-color="#ffe8a3"/>
      <stop offset="52%" stop-color="#ffd05f"/>
      <stop offset="100%" stop-color="#e1a925"/>
    </radialGradient>
    <radialGradient id="shadow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#080808"/>
    </radialGradient>
    <linearGradient id="badgeGold" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffe18b"/>
      <stop offset="100%" stop-color="#d79f1f"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".26"/>
    </filter>
  </defs>

  <ellipse cx="256" cy="450" rx="122" ry="20" fill="#0b0b12" opacity=".38"/>

  <g filter="url(#soft)">
    <ellipse cx="256" cy="324" rx="114" ry="94" fill="url(#gold)"/>
    <ellipse cx="165" cy="321" rx="33" ry="64" fill="url(#gold)" transform="rotate(22 165 321)"/>
    <ellipse cx="346" cy="321" rx="33" ry="64" fill="url(#gold)" transform="rotate(-22 346 321)"/>
    <ellipse cx="212" cy="430" rx="44" ry="53" fill="url(#gold)" transform="rotate(6 212 430)"/>
    <ellipse cx="300" cy="430" rx="44" ry="53" fill="url(#gold)" transform="rotate(-6 300 430)"/>
  </g>

  <circle cx="256" cy="186" r="144" fill="url(#gold)"/>
  <circle cx="256" cy="186" r="116" fill="url(#shadow)"/>

  <circle cx="256" cy="186" r="95" fill="none" stroke="url(#badgeGold)" stroke-width="8"/>
  <circle cx="256" cy="186" r="74" fill="none" stroke="url(#badgeGold)" stroke-width="6" opacity=".92"/>
  <circle cx="256" cy="186" r="56" fill="none" stroke="url(#badgeGold)" stroke-width="4" opacity=".9"/>

  <path d="M212 236l18-106 26 57 26-57 18 106h-22l-7-42-15 30h-2l-15-30-7 42z" fill="url(#badgeGold)"/>

  <g fill="url(#badgeGold)">
    <path d="M158 124c22-14 52-20 98-20 46 0 76 6 98 20l-8 11c-17-10-43-15-90-15-47 0-73 5-90 15z"/>
    <path d="M154 256c22 16 52 23 102 23 49 0 79-7 101-23l-8-11c-19 13-45 19-93 19-48 0-74-6-93-19z"/>
  </g>

  <text x="256" y="338" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#2f2b15" letter-spacing="2">NOT A PLUSHIE</text>
</svg>
